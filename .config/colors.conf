# Standard colors
black=$'\e[30m'
red=$'\e[31m'
green=$'\e[32m'
yellow=$'\e[33m'
blue=$'\e[34m'
purple=$'\e[35m'
cyan=$'\e[36m'
white=$'\e[37m'

# Bright colors
gray=$'\e[90m'
b_red=$'\e[91m'
b_green=$'\e[92m'
b_yellow=$'\e[93m'
b_blue=$'\e[94m'
b_purple=$'\e[95m'
b_cyan=$'\e[96m'
b_white=$'\e[97m'

# Background colors
bg_black=$'\e[40m'
bg_red=$'\e[41m'
bg_green=$'\e[42m'
bg_yellow=$'\e[43m'
bg_blue=$'\e[44m'
bg_purple=$'\e[45m'
bg_cyan=$'\e[46m'
bg_white=$'\e[47m'

# Formatting
bold=$'\e[1m'
dim=$'\e[2m'
italic=$'\e[3m'
underline=$'\e[4m'
reverse=$'\e[7m'
reset=$'\e[0m'

# Compatibility with your existing scripts
brown=$yellow

# Any color from the 256-color palette (0–255)
fg256() { printf '\e[38;5;%sm' "$1"; }
bg256() { printf '\e[48;5;%sm' "$1"; }

# RGB colors: red green blue, each 0–255
fg_rgb() { printf '\e[38;2;%s;%s;%sm' "$1" "$2" "$3"; }
bg_rgb() { printf '\e[48;2;%s;%s;%sm' "$1" "$2" "$3"; }
